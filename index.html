<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NU40 위치 전송</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 24px; background: #f4f6f8; color: #222; }
  h1 { font-size: 20px; margin-top: 0; }
  button { width: 100%; padding: 16px; font-size: 18px; border: none; border-radius: 10px; background: #1565c0; color: #fff; }
  button:disabled { background: #9e9e9e; }
  .box { margin-top: 16px; background: #fff; border-radius: 10px; padding: 14px; font-size: 16px; line-height: 1.6; }
  .small { font-size: 13px; color: #666; margin-top: 12px; }
</style>
</head>
<body>
<h1>NU40 위치 전송</h1>
<button id="connectBtn">보드 연결 (NU40_GPS 선택)</button>
<div class="box">
  <div id="status">상태: 연결 안 됨</div>
  <div id="coords">위도: -<br>경도: -</div>
</div>
<div class="small">
  위치 권한과 블루투스를 허용해 주세요. 페이지를 열어 둔 채로 두면 연결이 끊겨도 자동으로 다시 연결합니다.
</div>

<script>
// Nordic UART Service (Adafruit BLEUart와 동일한 UUID)
const UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const UART_RX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';   // 휴대폰 -> 보드
const UART_TX      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';   // 보드 -> 휴대폰

const connectBtn = document.getElementById('connectBtn');
const statusEl   = document.getElementById('status');
const coordsEl   = document.getElementById('coords');

let device = null;
let rxChar = null;
let txChar = null;
let latest = null;
let sending = false;
let lastSent = 0;
let watchStarted = false;
let reconnecting = false;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function setStatus(text) { statusEl.textContent = '상태: ' + text; }
function updateCoords(lat, lon) {
  coordsEl.innerHTML = '위도: ' + lat.toFixed(5) + '<br>경도: ' + lon.toFixed(5);
}

// 좌표를 보드로 전송. force가 true면 2초 제한을 무시하고 바로 보냄
async function sendPosition(pos, force) {
  latest = { lat: pos.coords.latitude, lon: pos.coords.longitude };
  updateCoords(latest.lat, latest.lon);
  if (!rxChar) return;

  if (!force && Date.now() - lastSent < 2000) return;
  while (sending) await sleep(50);   // 이전 전송이 끝날 때까지 대기
  if (!rxChar) return;

  sending = true;
  try {
    const text = latest.lat.toFixed(5) + ',' + latest.lon.toFixed(5) + '\n';
    await rxChar.writeValueWithoutResponse(new TextEncoder().encode(text));
    lastSent = Date.now();
    setStatus('보드로 전송 중');
  } catch (e) {
    setStatus('전송 실패: ' + e.message);
  } finally {
    sending = false;
  }
}

// 보드가 "REQ"를 보내면 지금 위치를 측정해서 바로 보냄
function onNotify(event) {
  const text = new TextDecoder().decode(event.target.value);
  if (!text.includes('REQ')) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => sendPosition(pos, true),
    (err) => setStatus('위치 오류: ' + err.message),
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
  );
}

function startWatch() {
  watchStarted = true;
  navigator.geolocation.watchPosition(
    (pos) => sendPosition(pos, false),
    (err) => setStatus('위치 오류: ' + err.message),
    { enableHighAccuracy: true, maximumAge: 0 }
  );
}

// 이미 가진 device 객체로 GATT 연결 및 특성 설정
async function linkDevice() {
  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(UART_SERVICE);
  rxChar = await service.getCharacteristic(UART_RX);
  txChar = await service.getCharacteristic(UART_TX);
  await txChar.startNotifications();
  txChar.addEventListener('characteristicvaluechanged', onNotify);

  setStatus('보드 연결됨, 위치 확인 중...');
  connectBtn.disabled = true;
  if (!watchStarted) startWatch();
}

// 연결이 끊기면 페이지가 열려 있는 동안 자동으로 재연결
async function onDisconnect() {
  rxChar = null;
  txChar = null;
  if (!device || reconnecting) return;
  reconnecting = true;

  for (let i = 1; i <= 30; i++) {
    setStatus('연결 끊김, 재연결 시도 ' + i + '/30');
    try {
      await sleep(i === 1 ? 500 : 2000);
      await linkDevice();
      reconnecting = false;
      return;
    } catch (e) {
      if (device.gatt.connected) device.gatt.disconnect();
    }
  }
  reconnecting = false;
  connectBtn.disabled = false;
  setStatus('재연결 실패. 보드 연결 버튼을 다시 눌러 주세요');
}

async function connect() {
  try {
    setStatus('장치 검색 중...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'NU40' }],
      optionalServices: [UART_SERVICE],
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    setStatus('연결 중...');
    await linkDevice();
  } catch (e) {
    setStatus('연결 실패: ' + e.message);
  }
}

if (!navigator.bluetooth) {
  setStatus('이 브라우저는 Web Bluetooth를 지원하지 않습니다 (Android Chrome 또는 Bluefy 사용)');
  connectBtn.disabled = true;
}
connectBtn.addEventListener('click', connect);
</script>
</body>
</html>
