  ["하이풀 스포츠","서울 은평구",37.6374827,126.9180231],
  ["종로 올림픽기념국민생활관","서울 종로구",37.590491,126.998824],
  ["종로구민회관","서울 종로구",37.5734077,127.0143151],
  ["종로문화체육센터","서울 종로구",37.5744017,126.9646323],
  ["서울덕수초교 수영장","서울 중구",37.56854647,126.9745494],
  ["서울YWCA 스포츠센터","서울 중구",37.56489136,126.9861362],
  ["충무스포츠센터","서울 중구",37.56593,127.014805],
  ["회현체육센터","서울 중구",37.556067,126.9816],
  ["면일체육문화센터","서울 중랑구",37.592073,127.099798],
  ["시립망우청소년센터","서울 중랑구",37.6062994,127.1088076],
  ["중랑구민체육센터","서울 중랑구",37.615132,127.0874624],
  ["중랑문화체육관","서울 중랑구",37.5792934,127.0957856],
  ["중랑워터파크","서울 중랑구",37.578188,127.077663],
  ["북한산힐스테이트3차커뮤니티센터","서울",37.618479,126.934913]
];

// Nordic UART Service (Adafruit BLEUart와 동일한 UUID)
const UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const UART_RX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';   // 휴대폰 -> 보드
const UART_TX      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';   // 보드 -> 휴대폰

const connectBtn = document.getElementById('connectBtn');
const statusEl   = document.getElementById('status');
const nearName   = document.getElementById('nearName');
const nearRegion = document.getElementById('nearRegion');
const nearDist   = document.getElementById('nearDist');
const coordsEl   = document.getElementById('coords');

let device = null;
let rxChar = null;
let watchStarted = false;
let reconnecting = false;
let sending = false;
let lastSent = 0;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function setStatus(text) { statusEl.textContent = '상태: ' + text; }

// 두 좌표 사이 거리(미터), 하버사인 공식
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// 가장 가까운 장소 찾기
function findNearest(lat, lon) {
  let best = -1;
  let bestDist = Infinity;
  for (let i = 0; i < POOLS.length; i++) {
    const d = haversine(lat, lon, POOLS[i][2], POOLS[i][3]);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return { index: best, dist: bestDist };
}

function formatDist(m) {
  return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2) + ' km';
}

function showNearest(lat, lon, near) {
  const p = POOLS[near.index];
  nearName.textContent = '가까운 곳: ' + p[0];
  nearRegion.textContent = p[1];
  nearDist.textContent = '거리: ' + formatDist(near.dist);
  coordsEl.textContent = '내 위치: ' + lat.toFixed(5) + ', ' + lon.toFixed(5);
}

// 현재 위치를 처리: 화면 갱신 후 보드로 "#번호,거리" 전송
async function handlePosition(pos, force) {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const near = findNearest(lat, lon);
  showNearest(lat, lon, near);
  if (!rxChar) return;

  if (!force && Date.now() - lastSent < 2000) return;
  while (sending) await sleep(50);
  if (!rxChar) return;

  sending = true;
  try {
    const text = '#' + (near.index + 1) + ',' + Math.round(near.dist) + '\n';
    await rxChar.writeValueWithoutResponse(new TextEncoder().encode(text));
    lastSent = Date.now();
    setStatus('보드로 전송 중');
  } catch (e) {
    setStatus('전송 실패: ' + e.message);
  } finally {
    sending = false;
  }
}

// 보드가 "REQ"를 보내면 지금 위치를 새로 측정해서 바로 보냄
function onNotify(event) {
  const text = new TextDecoder().decode(event.target.value);
  if (!text.includes('REQ')) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => handlePosition(pos, true),
    (err) => setStatus('위치 오류: ' + err.message),
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
  );
}

function startWatch() {
  watchStarted = true;
  navigator.geolocation.watchPosition(
    (pos) => handlePosition(pos, false),
    (err) => setStatus('위치 오류: ' + err.message),
    { enableHighAccuracy: true, maximumAge: 0 }
  );
}

// 이미 가진 device 객체로 GATT 연결 및 특성 설정
async function linkDevice() {
  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(UART_SERVICE);
  rxChar = await service.getCharacteristic(UART_RX);
  const txChar = await service.getCharacteristic(UART_TX);
  await txChar.startNotifications();
  txChar.addEventListener('characteristicvaluechanged', onNotify);

  setStatus('보드 연결됨, 위치 확인 중...');
  connectBtn.disabled = true;
  if (!watchStarted) startWatch();
}

// 연결이 끊기면 페이지가 열려 있는 동안 자동으로 재연결
async function onDisconnect() {
  rxChar = null;
  if (!device || reconnecting) return;
  reconnecting = true;

  for (let i = 1; i <= 30; i++) {
    setStatus('연결 끊김, 재연결 시도 ' + i + '/30');
    try {
      await sleep(i === 1 ? 500 : 2000);
      await linkDevice();
      reconnecting = false;
      return;
    } catch (e) {
      if (device.gatt.connected) device.gatt.disconnect();
    }
  }
  reconnecting = false;
  connectBtn.disabled = false;
  setStatus('재연결 실패. 보드 연결 버튼을 다시 눌러 주세요');
}

async function connect() {
  try {
    setStatus('장치 검색 중...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'NU40' }],
      optionalServices: [UART_SERVICE],
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    setStatus('연결 중...');
    await linkDevice();
  } catch (e) {
    setStatus('연결 실패: ' + e.message);
  }
}

if (!navigator.bluetooth) {
  setStatus('이 브라우저는 Web Bluetooth를 지원하지 않습니다 (Android Chrome 또는 Bluefy 사용)');
  connectBtn.disabled = true;
}
connectBtn.addEventListener('click', connect);
</script>
